[workspace]
resolver = "2"
members = ["crates/downpour-core", "crates/downpour-cli", "src-tauri"]

[workspace.package]
version = "1.2.0"
edition = "2021"
rust-version = "1.82"
license-file = "LICENSE"
repository = "https://github.com/ali-kin4/downpour"
authors = ["Ali Jabbary"]

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
reqwest = { version = "0.12", default-features = false, features = [
    "stream", "rustls-tls", "gzip", "brotli", "deflate", "http2", "charset", "cookies"
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures = "0.3"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros", "local-offset"] }
sha2 = "0.10"
bytes = "1"
parking_lot = "0.12"
rusqlite = { version = "0.32", features = ["bundled", "serde_json"] }
percent-encoding = "2"

[profile.release]
opt-level = 3
# Thin LTO rather than fat. Fat LTO plus codegen-units = 1 took roughly fifty
# minutes on a two-core CI runner against four locally, to buy a percent or two
# of size on a program whose bottleneck is a network socket. Thin LTO keeps
# nearly all of the benefit at a fraction of the build time.
lto = "thin"
codegen-units = 4
panic = "abort"
strip = true
